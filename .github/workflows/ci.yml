name: Tether CI

on:
  push:
    branches: [master, "overhaul/**", "design/**", "rebuild/**", "review/**", "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Demo prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install demo test dependencies
        run: npm install --no-audit --no-fund
      - name: Parse every shipped script
        run: |
          for script in $(grep -oP '(?<=<script src=")[^"?]+' index.html); do
            echo "checking $script"
            node --check "$script"
          done
      - name: Run demo tests
        run: |
          set +e
          timeout 45s npm test > demo-test.log 2>&1
          status=$?
          cat demo-test.log
          exit $status
      - name: Upload demo failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-failure
          path: demo/demo-test.log
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Backend service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install --disable-pip-version-check --quiet -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret-not-used-outside-github-actions
        run: |
          set +e
          pytest -q --tb=short > pytest.log 2>&1
          status=$?
          cat pytest.log
          exit $status
      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure
          path: backend/pytest.log
          if-no-files-found: error
          retention-days: 3

  guardrails:
    name: Security guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject known unsafe defaults
        run: |
          ! grep -R "tether-dev-secret-key-change-in-production" backend --exclude-dir=__pycache__
          ! grep -R 'allow_origins=\["\*"\]' backend --exclude-dir=__pycache__
      - name: Reject committed databases and credentials
        run: |
          if git ls-files | grep -E '\.(db|sqlite3?)$'; then
            echo "::error::A database file is tracked in git. Remove it and gitignore it."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi
      - name: Reject orphaned submodule pointers
        run: |
          orphans=$(git ls-files -s | awk '$1 == "160000" { print $4 }')
          if [ -n "$orphans" ] && [ ! -f .gitmodules ]; then
            echo "::error::Submodule pointers exist with no .gitmodules: $orphans"
            exit 1
          fi
