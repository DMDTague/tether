name: Publish Tether Backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check --quiet -r requirements.txt
      - env:
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret-not-used-outside-github-actions
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/dmdtague/tether-backend:latest
            ghcr.io/dmdtague/tether-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger configured backend host
        # The `secrets` context is not available in `if:` conditions, so the
        # previous `if: ${{ secrets.X != '' }}` never evaluated as intended.
        # Read the secret into env and branch inside the step instead.
        env:
          DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No BACKEND_DEPLOY_HOOK_URL configured; skipping deploy hook."
            exit 0
          fi
          curl --fail --show-error --silent --request POST "$DEPLOY_HOOK_URL"
