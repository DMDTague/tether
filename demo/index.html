<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A0912">
  <meta name="description" content="Tether is the social music world where listening becomes identity, connection, and memory.">
  <meta property="og:title" content="Tether — Be there in the song">
  <meta property="og:description" content="Hear the same second together. Meet through music. Keep the moments that matter.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dmdtague.github.io/tether/">
  <meta property="og:image" content="https://dmdtague.github.io/tether/brand/tether-mark.svg">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="brand/tether-mark.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/outfit-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="media/alex-editorial.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="tether.css?v=1">
  <title>Tether — Be there in the song</title>
</head>
<body>
  <main class="app-shell" aria-label="Tether interactive product demo">
    <div class="ambient-field" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand-lockup" type="button" data-action="about" aria-label="About Tether">
        <img src="brand/tether-mark.svg" alt="">
        <span>tether</span>
      </button>
      <div class="topbar-actions">
        <button class="icon-button create-button" type="button" data-action="create" aria-label="Create a review or list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-button inbox-button" type="button" data-action="inbox" aria-label="Open messages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z"/><path d="m5 8 7 5 7-5"/></svg>
          <span class="notification-dot" data-unread-count>3</span>
        </button>
        <button class="avatar-button" type="button" data-action="self" aria-label="Open your profile">
          <img data-self-avatar src="media/alex-editorial.webp" alt="">
        </button>
      </div>
    </header>

    <div id="app-content" class="app-content">
      <section id="listen-view" class="view active" data-view-panel="listen" role="tabpanel" aria-labelledby="listen-tab"></section>
      <section id="exchange-view" class="view" data-view-panel="exchange" role="tabpanel" aria-labelledby="exchange-tab" hidden></section>
      <section id="people-view" class="view" data-view-panel="people" role="tabpanel" aria-labelledby="people-tab" hidden></section>
      <section id="you-view" class="view" data-view-panel="you" role="tabpanel" aria-labelledby="you-tab" hidden></section>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button id="listen-tab" class="nav-item active" type="button" role="tab" aria-selected="true" aria-controls="listen-view" data-nav="listen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2.2-5 4.1 10 2.2-5H20"/></svg>
        <span>Listen</span>
      </button>
      <button id="exchange-tab" class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="exchange-view" data-nav="exchange">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v11H9l-4 3V5Z"/><path d="M9 9h6M9 12h4"/></svg>
        <span>Exchange</span>
      </button>
      <button class="tether-fab" type="button" data-action="open-session" aria-label="Open your listening">
        <span class="fab-rings" aria-hidden="true"></span>
        <img src="brand/tether-mark.svg" alt="">
        <span>Tether</span>
      </button>
      <button id="people-tab" class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="people-view" data-nav="people">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="11" r="2.5"/><path d="M3.5 19c.6-3.3 2.5-5 5.5-5s4.9 1.7 5.5 5M14 16c2.8-.8 5.2.3 6 3"/></svg>
        <span>People</span>
        <i class="nav-badge">3</i>
      </button>
      <button id="you-tab" class="nav-item" type="button" role="tab" aria-selected="false" aria-controls="you-view" data-nav="you">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/></svg>
        <span>You</span>
      </button>
    </nav>

    <section id="overlay-root" class="overlay-root" aria-live="polite"></section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="v15.js?v=2" defer></script>
</body>
</html>
